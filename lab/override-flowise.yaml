# Lab only: pin the image, bind the port to 127.0.0.1, and keep data in a
# directory the container user (uid 1000) can write. The upstream bind mount
# of ~/.flowise is created by Docker as root on the runner.
services:
  flowise:
    image: flowiseai/flowise:3.1.4
    ports: !override
      - "127.0.0.1:3000:3000"
    volumes: !override
      - ./flowise-data:/home/node/.flowise
